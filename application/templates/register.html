{% extends 'base.html' %}

{% block content  %}

    <!-- preload -->
    <div class="preload preload-container">
        <div class="preload-logo">
            <div class="spinner"></div>
        </div>
    </div>
    <!-- /preload -->
    

        <!-- page-title -->
        <div class="tf-page-title style-2">
            <div class="container-full">
                <div class="heading text-center">Welcome to Keshi Limited</div>
            </div>
        </div>
        <!-- /page-title -->
    
        <section class="flat-spacing-10">
            <div class="container">
                <div class="form-register-wrap">
                    <div class="flat-title align-items-start gap-0 mb_30 px-0">
                        <h5 class="mb_18">Register</h5>
                        <p class="text_black-2">Sign up to access a wide range of electronics at unbeatable prices</p>
                    </div>
                    <div>
                        <form class="" id="register-form"  method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            {{ form.as_p }}
                            
                            <div class="mb_20">
                                <button type="submit" class="tf-btn w-100 radius-3 btn-fill animate-hover-btn justify-content-center">Register</button>
                            </div>
                            <div class="text-center">
                               
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>



   


{% endblock %}
